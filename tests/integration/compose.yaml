# Disposable local integration environment. No host ports or external service connections.
services:
  db:
    image: mariadb@sha256:a8992b5e5404d11e03c54a31d0c1bdea3fd116d283aa6d1a627551f29045309b
    environment:
      MARIADB_DATABASE: ontogeny_a03
      MARIADB_USER: a03_fixture
      MARIADB_PASSWORD: a03-local-fixture-only
      MARIADB_ROOT_PASSWORD: a03-local-root-fixture-only
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [isolated]
  wordpress:
    image: wordpress@sha256:9b46af6a41fd0dcb2e5cf85033a6350d05010356847ede1cfcac5cf94292eb26
    depends_on:
      db:
        condition: service_healthy
    environment:
      ONTOGENY_A03_LAB: "1"
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ontogeny_a03
      WORDPRESS_DB_USER: a03_fixture
      WORDPRESS_DB_PASSWORD: a03-local-fixture-only
      WORDPRESS_TABLE_PREFIX: a03_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('DISABLE_WP_CRON', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_HOME', 'http://wordpress');
        define('WP_SITEURL', 'http://wordpress');
    volumes:
      - wp-data:/var/www/html
      - ../..:/opt/ontogeny:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/var/www/html/wp-config.php') && is_file('/var/www/html/wp-load.php') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [isolated]
networks:
  isolated:
    internal: true
volumes:
  db-data:
  wp-data:
